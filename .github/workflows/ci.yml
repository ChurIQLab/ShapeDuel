name: CI

on:
  pull_request:
    branches:
      - develop
      - master
  # Rebase and merge creates new commits on develop, and master moves by fast-forward without a PR
  push:
    branches:
      - develop
      - master
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the local Xcode
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # Keep in sync with the local SwiftLint; the checksum is the sha256 digest of portable_swiftlint.zip on the release page
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
  SIMULATOR_DEVICE: iPhone 16

jobs:
  lint-build-test:
    name: Lint, build and test
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash adds -o pipefail, so xcbeautify does not hide xcodebuild failures
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

      # A fresh simulator booted in advance, so xcodebuild does not hit boot timeouts.
      # Now and then xcodebuild on the runner does not see any simulator, although simctl shows it booted
      # (actions/runner-images#12948). Waiting does not help then, restarting CoreSimulatorService does
      - name: Boot simulator
        run: |
          is_seen_by_xcodebuild() {
            for attempt in 1 2 3; do
              destinations=$(xcodebuild -showdestinations -project ShapeDuel.xcodeproj -scheme ShapeDuel 2>&1 || true)
              grep -q "id:$udid" <<< "$destinations" && return 0
              echo "Attempt $attempt: xcodebuild does not see the simulator yet"
              sleep 15
            done
            return 1
          }

          udid=$(xcrun simctl create "CI $SIMULATOR_DEVICE" "$SIMULATOR_DEVICE")
          xcrun simctl bootstatus "$udid" -b
          if ! is_seen_by_xcodebuild; then
            echo "::warning::xcodebuild does not see the simulator, restarting CoreSimulatorService"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            xcrun simctl bootstatus "$udid" -b
            if ! is_seen_by_xcodebuild; then
              echo "$destinations"
              xcrun simctl list runtimes
              xcrun simctl list devices booted
              exit 1
            fi
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -version
          xcodebuild build-for-testing \
            -project ShapeDuel.xcodeproj \
            -scheme ShapeDuel \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions

      # Parallel testing runs on simulator clones, and creating a clone fails intermittently
      - name: Test
        run: |
          xcodebuild test-without-building \
            -project ShapeDuel.xcodeproj \
            -scheme ShapeDuel \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:ShapeDuelTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            | xcbeautify --renderer github-actions

      # A separate step, so a failure tells unit tests from UI tests
      - name: UI tests
        run: |
          xcodebuild test-without-building \
            -project ShapeDuel.xcodeproj \
            -scheme ShapeDuel \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:ShapeDuelUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            | xcbeautify --renderer github-actions

      # Logs, screenshots and the accessibility audit of a failed run, to open in Xcode
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
